          nullable: true
        lastHeartbeatAt:
          type: string
          description: Timestamp of the last heartbeat received from the worker.
          format: date-time
          nullable: true
        completedAt:
          type: string
          description: When the sync reached a terminal state (Completed, Failed, Aborted).
          format: date-time
          nullable: true
