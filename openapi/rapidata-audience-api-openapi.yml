          format: uint32
        minSubmissionRate:
          type:
          - number
          - 'null'
          description: "Minimum submission rate (responses / sessions) before a user is dropped.\n Defaults to null (disabled)."
          format: double
        minSessionsForSubmissionRate:
          type:
          - integer
          - 'null'
          description: "Minimum number of sessions before the submission rate check applies.\n Defaults to null (applies from first session)."
          format: uint32
        minSubmissionRateGraduated:
          type:
          - number
          - 'null'
          description: "Minimum submission rate for graduated users. If null, MinSubmissionRate applies to graduated users.\n Set a lower value to be more lenient with graduated users."
          format: double
        distillingRetrievalMode:
          allOf:
          - $ref: '#/components/schemas/RetrievalMode'
          description: "The retrieval mode used by the distilling campaign to select rapids for users.\n Defaults to Shuffled."
        minDistillingForGlobalBoost:
          type:
          - integer
          - 'null'
          description: "Minimum distilling users before disabling global boost.\n Defaults to 200. Admin-only override."
          format: int32
        minGraduatedForDistillingBoost:
          type:
          - integer
          - 'null'
          description: "Minimum graduated users before disabling distilling boost.\n Defaults to 100. Admin-only override."
          format: int32
    IAudienceFilterDemographicAudienceFilter:
      required:
      - identifier
      - values
      - _t
      properties:
        _t:
          enum:
          - DemographicFilter
          type: string
        identifier:
          type: string
        values:
          type: array
          items:
            type: string
    IAudienceFilterOrAudienceFilter:
      required:
      - filters
      - _t
      properties:
        _t:
          enum:
          - OrFilter
          type: string
        filters:
          type: array
          items:
            $ref: '#/components/schemas/IAudienceFilter'
    GetAudienceStateRecalculationByIdEndpoint_Output:
      required:
      - id
      - audienceId
      - state
      - phase
      - processedCount
      - changedCount
      - createdAt
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the recalculation.
        audienceId:
          type: string
          description: The audience this recalculation belongs to.
        state:
          allOf:
          - $ref: '#/components/schemas/AudienceStateRecalculationState'
          description: The current state of the recalculation.
        phase:
          allOf:
          - $ref: '#/components/schemas/AudienceStateRecalculationPhase'
          description: The current phase within the recalculation lifecycle.
        lastProcessedUserId:
          type:
          - string
          - 'null'
          description: The id of the last user that was processed (progress cursor).
        processedCount:
          type: integer
          description: The number of users processed so far.
          format: int64
        changedCount:
          type: integer
          description: The number of users whose state was changed by the recalculation.
          format: int64
        errorMessage:
          type:
          - string
          - 'null'
          description: Error message populated when the recalculation transitioned to Failed.
        startedAt:
          type:
          - string
          - 'null'
          description: When the recalculation began processing (null while still Pending).
          format: date-time
        lastHeartbeatAt:
          type:
          - string
          - 'null'
          description: Timestamp of the last heartbeat received from the worker.
          format: date-time
        completedAt:
          type:
          - string
          - 'null'
          description: When the recalculation reached a terminal state (Completed, Failed, Aborted).
          format: date-time
        createdAt:
          type: string
          description: When the recalculation was created.
          format: date-time
    UpdateAudienceEndpoint_Output:
      type: object
      properties:
        recalculationId:
          type:
          - string
          - 'null'
          description: "The id of the audience state recalculation that was dispatched as a result of this update.\n Only populated when state-affecting parameters (e.g. graduation score, drop score) changed;\n null when the update only touched descriptive fields or boost configuration."
        inactivitySyncId:
          type:
          - string
          - 'null'
          description: "The id of the audience inactivity sync that was dispatched as a result of this update.\n Only populated when InactivityDropDays was changed to a non-null value; null otherwise."
    IAudienceFilter:
      required:
      - _t
      type: object
      oneOf:
      - $ref: '#/components/schemas/IAudienceFilterAndAudienceFilter'
      - $ref: '#/components/schemas/IAudienceFilterCountryAudienceFilter'
      - $ref: '#/components/schemas/IAudienceFilterDemographicAudienceFilter'
      - $ref: '#/components/schemas/IAudienceFilterDeviceAudienceFilter'
      - $ref: '#/components/schemas/IAudienceFilterLanguageAudienceFilter'
      - $ref: '#/components/schemas/IAudienceFilterNotAudienceFilter'
      - $ref: '#/components/schemas/IAudienceFilterOrAudienceFilter'
      discriminator:
        propertyName: _t
        mapping:
          AndFilter: '#/components/schemas/IAudienceFilterAndAudienceFilter'
          CountryFilter: '#/components/schemas/IAudienceFilterCountryAudienceFilter'
          DemographicFilter: '#/components/schemas/IAudienceFilterDemographicAudienceFilter'
          DeviceFilter: '#/components/schemas/IAudienceFilterDeviceAudienceFilter'
          LanguageFilter: '#/components/schemas/IAudienceFilterLanguageAudienceFilter'
          NotFilter: '#/components/schemas/IAudienceFilterNotAudienceFilter'
          OrFilter: '#/components/schemas/IAudienceFilterOrAudienceFilter'
