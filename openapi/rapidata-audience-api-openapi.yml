          format: int64
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        items:
          type: array
          items:
            $ref: '#/components/schemas/QueryAudiencesEndpoint_Output'
        totalPages:
          type: integer
          format: int32
    QueryAudiencesEndpoint_Output:
      required:
      - id
      - name
      - status
      - qualifiedUserCount
      - filters
      - createdAt
      - ownerMail
      - isPublic
      - isDistilling
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the audience.
        name:
          type: string
          description: The name of the audience.
        description:
          type:
          - string
          - 'null'
          description: The markdown-supported description of the audience.
        status:
          allOf:
          - $ref: '#/components/schemas/AudienceStatus'
          description: The current status of the audience.
        qualifiedUserCount:
          type: integer
          description: The number of users that have qualified for this audience.
          format: int64
        filters:
          allOf:
          - type: array
            items:
              $ref: '#/components/schemas/IAudienceFilter'
          description: The filters applied to this audience.
        logo:
          type:
          - string
          - 'null'
          description: The URL of the audience logo, if any.
        createdAt:
          type: string
          description: The timestamp when the audience was created.
          format: date-time
        ownerMail:
          type: string
          description: The email of the audience owner.
        isPublic:
          type: boolean
          description: Whether the audience is publicly visible.
        isDistilling:
          type: boolean
          description: Whether the audience is currently distilling users.
        randomAdmissionProbability:
          type:
          - number
          - 'null'
          description: The probability of admitting a random user to the audience.
          format: double
        health:
          type:
          - number
          - 'null'
          description: The health score of the audience.
          format: double
        graduated:
          type: integer
          description: The number of graduated users.
          format: int64
        dropped:
          type: integer
          description: The number of dropped users.
          format: int64
