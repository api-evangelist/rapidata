            $ref: '#/components/schemas/IAudienceFilter'
    CreateAudienceEndpoint_Input:
      required:
      - name
      type: object
      properties:
        name:
          type: string
          description: The name to give the newly created audience.
        description:
          type: string
          description: An optional markdown-supported description of the audience's purpose.
          nullable: true
        filters:
          allOf:
          - type: array
            items:
              $ref: '#/components/schemas/IAudienceFilter'
            nullable: true
          description: "The filters to apply to any orders created for this audience.\n A filter can be used to restrict the audience to a specific subset of users."
        graduationScore:
          type: number
          description: The score used to determine whether a user graduates from the distilling campaign.
          format: double
          nullable: true
        demotionScore:
          type: number
          description: "Score below which a graduated user is demoted back to distilling.\n Must be less than or equal to GraduationScore. Defaults to null (uses GraduationScore)."
          format: double
          nullable: true
        minimumSizeForActivation:
          type: integer
          description: The minimum number of users required for an audience to be activated.
          format: int64
          nullable: true
        logo:
          allOf:
          - $ref: '#/components/schemas/ExistingAssetInput'
          description: An optional logo image for the audience. Must be an existing image asset.
        maxDistillingResponses:
          type: integer
          description: "Maximum responses before user exits the distilling campaign.\n Defaults to 10. Set to null to disable this exit condition."
          format: uint32
          nullable: true
        minResponsesToGraduate:
          type: integer
          description: "Minimum responses required before a user can graduate into the audience.\n Even if the user's score is at or above the graduation threshold, they will\n remain in distilling until they have answered at least this many responses.\n Must be strictly less than MaxDistillingResponses when both are set.\n Defaults to null (no minimum — users graduate as soon as the score is reached)."
          format: uint32
          nullable: true
        dropMinResponses:
          type: integer
          description: "Minimum responses before the drop score check applies.\n Users need at least this many responses before they can be kicked out for low score.\n Defaults to 3. Set to null to apply drop score check from the first response."
          format: uint32
          nullable: true
        dropScore:
          type: number
          description: "Score floor - users below this score exit the distilling campaign\n (only after completing DropMinResponses).\n Defaults to 0.2. Set to null to disable this exit condition."
          format: double
          nullable: true
        isDistillingCampaignSticky:
          type: boolean
          description: "Whether the distilling campaign should be sticky (users stay until filters don't match).\n Defaults to true (Temporary sticky)."
        maxDistillingSessions:
          type: integer
          description: "Maximum sessions (rapid retrievals) before user exits the distilling campaign.\n Defaults to null (disabled). Set to a value to enable session-based exit condition."
          format: uint32
          nullable: true
        inactivityDropDays:
          type: integer
          description: "Number of days of inactivity before a distilling user is dropped.\n Defaults to null (disabled)."
          format: uint32
          nullable: true
        minSubmissionRate:
          type: number
          description: "Minimum submission rate (responses / sessions) before a user is dropped.\n Defaults to null (disabled)."
          format: double
          nullable: true
        minSessionsForSubmissionRate:
          type: integer
          description: "Minimum number of sessions before the submission rate check applies.\n Defaults to null (applies from first session)."
          format: uint32
          nullable: true
        minSubmissionRateGraduated:
          type: number
          description: "Minimum submission rate for graduated users. If null, MinSubmissionRate applies to graduated users.\n Set a lower value to be more lenient with graduated users."
          format: double
          nullable: true
        distillingRetrievalMode:
          allOf:
          - $ref: '#/components/schemas/RetrievalMode'
          description: "The retrieval mode used by the distilling campaign to select rapids for users.\n Defaults to Shuffled."
        minDistillingForGlobalBoost:
          type: integer
          description: "Minimum distilling users before disabling global boost.\n Defaults to 200. Admin-only override."
          format: int32
          nullable: true
        minGraduatedForDistillingBoost:
          type: integer
          description: "Minimum graduated users before disabling distilling boost.\n Defaults to 100. Admin-only override."
