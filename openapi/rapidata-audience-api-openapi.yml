        lastHeartbeatAt:
          type: string
          description: Timestamp of the last heartbeat received from the worker.
          format: date-time
          nullable: true
        completedAt:
          type: string
          description: When the recalculation reached a terminal state (Completed, Failed, Aborted).
          format: date-time
          nullable: true
        createdAt:
          type: string
          description: When the recalculation was created.
          format: date-time
    IAudienceFilterLanguageAudienceFilter:
      required:
      - languages
      - _t
      properties:
        _t:
          enum:
          - LanguageFilter
          type: string
        languages:
          type: array
          items:
            type: string
    DeviceType:
      enum:
      - Unknown
      - Phone
      - Tablet
    IAudienceFilter:
      required:
      - _t
      type: object
      oneOf:
      - $ref: '#/components/schemas/IAudienceFilterAndAudienceFilter'
      - $ref: '#/components/schemas/IAudienceFilterCountryAudienceFilter'
      - $ref: '#/components/schemas/IAudienceFilterDemographicAudienceFilter'
      - $ref: '#/components/schemas/IAudienceFilterDeviceAudienceFilter'
      - $ref: '#/components/schemas/IAudienceFilterLanguageAudienceFilter'
      - $ref: '#/components/schemas/IAudienceFilterNotAudienceFilter'
      - $ref: '#/components/schemas/IAudienceFilterOrAudienceFilter'
      discriminator:
        propertyName: _t
        mapping:
          AndFilter: '#/components/schemas/IAudienceFilterAndAudienceFilter'
          CountryFilter: '#/components/schemas/IAudienceFilterCountryAudienceFilter'
          DemographicFilter: '#/components/schemas/IAudienceFilterDemographicAudienceFilter'
          DeviceFilter: '#/components/schemas/IAudienceFilterDeviceAudienceFilter'
          LanguageFilter: '#/components/schemas/IAudienceFilterLanguageAudienceFilter'
          NotFilter: '#/components/schemas/IAudienceFilterNotAudienceFilter'
          OrFilter: '#/components/schemas/IAudienceFilterOrAudienceFilter'
    StartAudienceInactivitySyncEndpoint_Output:
      required:
      - syncId
      type: object
      properties:
        syncId:
          type: string
          description: The id of the inactivity sync that was started or reused.
    UpdateAudienceEndpoint_Input:
      type: object
      properties:
        name:
          type: string
          description: The new name to give to this audience.
        description:
          type: string
          description: The new description for the audience. Supports markdown. Set to null to remove.
          nullable: true
        filters:
          allOf:
          - type: array
            items:
              $ref: '#/components/schemas/IAudienceFilter'
          description: "The new filters to apply to any orders created for this audience.\n A filter can be used to restrict the audience to a specific subset of users."
        logo:
          type: object
          oneOf:
          - $ref: '#/components/schemas/ExistingAssetInput'
          description: "The new logo image for the audience. Must be an existing image asset.\n Set to null to remove the logo."
          nullable: true
        minGraduatedForDistillingBoost:
          type: integer
          description: "Minimum graduated users before disabling distilling boost.\n When graduated count is below this, external distilling audience ID is added to campaign boosting."
          format: int32
          nullable: true
        minDistillingForGlobalBoost:
          type: integer
          description: "Minimum distilling users before disabling global boost.\n When distilling count is below this, GlobalBoostLevel is set above zero."
          format: int32
          nullable: true
        graduationScore:
          type: number
          description: The score used to determine whether a user graduates from the distilling campaign.
          format: double
        demotionScore:
          type: number
          description: "Score below which a graduated user is demoted back to distilling.\n Must be less than or equal to GraduationScore. Set to null to use GraduationScore."
          format: double
          nullable: true
        maxDistillingResponses:
          type: integer
          description: "Maximum responses before user exits the distilling campaign.\n Set to null to disable this exit condition."
          format: uint32
          nullable: true
        minResponsesToGraduate:
          type: integer
          description: "Minimum responses required before a user can graduate into the audience.\n Even if the user's score is at or above the graduation threshold, they will\n remain in distilling until they have answered at least this many responses.\n Must be strictly less than MaxDistillingResponses when both are set.\n Set to null to allow graduation as soon as the score is reached."
          format: uint32
          nullable: true
        dropMinResponses:
          type: integer
          description: "Minimum responses before the drop score check applies.\n Users need at least this many responses before they can be kicked out for low score.\n Set to null to apply drop score check from the first response."
          format: uint32
          nullable: true
        dropScore:
          type: number
          description: "Score floor - users below this score exit the distilling campaign\n (only after completing DropMinResponses).\n Set to null to disable this exit condition."
          format: double
          nullable: true
        maxDistillingSessions:
          type: integer
          description: "Maximum sessions (rapid retrievals) before user exits the distilling campaign.\n Set to a value to enable session-based exit condition."
          format: uint32
          nullable: true
        inactivityDropDays:
          type: integer
          description: "Number of days of inactivity before a distilling user is dropped.\n Set to null to disable this exit condition."
          format: uint32
          nullable: true
        minSubmissionRate:
          type: number
          description: "Minimum submission rate (responses / sessions) before a user is dropped.\n Set to null to disable this exit condition."
          format: double
          nullable: true
        minSessionsForSubmissionRate:
          type: integer
          description: "Minimum number of sessions before the submission rate check applies.\n Set to null to apply from the first session."
          format: uint32
          nullable: true
        minSubmissionRateGraduated:
          type: number
          description: "Minimum submission rate for graduated users. If null, MinSubmissionRate applies to graduated users.\n Set a lower value to be more lenient with graduated users."
          format: double
          nullable: true
        distillingRetrievalMode:
          allOf:
          - $ref: '#/components/schemas/RetrievalMode'
          description: The retrieval mode used by the distilling campaign to select rapids for users.
    ChangeAudienceOwnerEndpoint_Input:
      required:
      - ownerId
      - ownerMail
      type: object
      properties:
        ownerId:
          type: string
          description: The unique identifier of the new owner.
          format: uuid
        ownerMail:
          type: string
          description: The email address of the new owner.
    IAudienceFilterNotAudienceFilter:
      required:
      - filter
      - _t
      properties:
        _t:
          enum:
          - NotFilter
          type: string
        filter:
          $ref: '#/components/schemas/IAudienceFilter'
    AudienceStateRecalculationState:
      enum:
      - Pending
      - Processing
      - Completed
      - Failed
      - Aborted
    MetadataInputCollection:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/IMetadataInput'
    AudienceInactivitySyncPhase:
      enum:
      - MarkingInactiveUsers
      - Finalizing
      - Done
    QueryAudienceJobsEndpoint_PagedResultOfOutput:
      required:
      - total
      - page
      - pageSize
      - items
      type: object
      properties:
        total:
          type: integer
          format: int64
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        items:
          type: array
          items:
            $ref: '#/components/schemas/QueryAudienceJobsEndpoint_Output'
        totalPages:
          type: integer
          format: int32
    IAudienceFilterDeviceAudienceFilter:
      required:
      - deviceTypes
      - _t
      properties:
        _t:
          enum:
          - DeviceFilter
          type: string
        deviceTypes:
          type: array
          items:
            $ref: '#/components/schemas/DeviceType'
    IMetadataInput:
      required:
      - _t
      type: object
      oneOf:
      - $ref: '#/components/schemas/IMetadataInputTextMetadataInput'
      discriminator:
        propertyName: _t
        mapping:
          TextMetadataInput: '#/components/schemas/IMetadataInputTextMetadataInput'
    QueryAudiencesEndpoint_PagedResultOfOutput:
      required:
      - total
      - page
      - pageSize
      - items
      type: object
      properties:
        total:
          type: integer
          format: int64
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        items:
          type: array
          items:
            $ref: '#/components/schemas/QueryAudiencesEndpoint_Output'
        totalPages:
          type: integer
          format: int32
    IAudienceFilterCountryAudienceFilter:
      required:
      - countries
      - _t
      properties:
        _t:
          enum:
          - CountryFilter
          type: string
        countries:
          type: array
          items:
            type: string
    AudienceInactivitySyncState:
      enum:
      - Pending
      - Processing
      - Completed
      - Failed
      - Aborted
    AudienceJobState:
      enum:
      - Submitted
      - Running
      - Completed
      - Failed
      - ManualApproval
      - Queued
      - Paused
      - StaleResults
      - SpendLimited
