    UpdateAudienceEndpoint_Output:
      type: object
      properties:
        recalculationId:
          type: string
          description: "The id of the audience state recalculation that was dispatched as a result of this update.\n Only populated when state-affecting parameters (e.g. graduation score, drop score) changed;\n null when the update only touched descriptive fields or boost configuration."
          nullable: true
        inactivitySyncId:
          type: string
          description: "The id of the audience inactivity sync that was dispatched as a result of this update.\n Only populated when InactivityDropDays was changed to a non-null value; null otherwise."
          nullable: true
    IAudienceFilterAndAudienceFilter:
      required:
