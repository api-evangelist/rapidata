          description: The filters applied to this audience.
        logo:
          type: string
          description: The URL of the audience logo, if any.
          nullable: true
        createdAt:
          type: string
          description: The timestamp when the audience was created.
          format: date-time
        ownerId:
          type: string
          description: The unique identifier of the audience owner.
          format: uuid
        ownerMail:
          type: string
          description: The email of the audience owner.
        isPublic:
          type: boolean
          description: Whether the audience is publicly visible.
        isDistilling:
          type: boolean
          description: Whether the audience is currently distilling users.
        distillingCampaignId:
          type: string
          description: The id of the distilling campaign associated with the audience.
        minGraduatedForDistillingBoost:
          type: integer
          description: Minimum graduated users before disabling distilling boost.
          format: int32
          nullable: true
        minDistillingForGlobalBoost:
          type: integer
          description: Minimum distilling users before disabling global boost.
          format: int32
          nullable: true
        graduationScore:
          type: number
          description: The score used to determine whether a user graduates from the distilling campaign.
          format: double
        demotionScore:
          type: number
          description: Score below which a graduated user is demoted back to distilling.
          format: double
          nullable: true
        maxDistillingResponses:
          type: integer
          description: Maximum responses before user exits the distilling campaign.
          format: uint32
          nullable: true
        minResponsesToGraduate:
          type: integer
          description: "Minimum responses required before a user can graduate into the audience.\n Even if the user's score is at or above the graduation threshold, they will\n remain in distilling until they have answered at least this many responses.\n Null when no minimum is configured."
          format: uint32
          nullable: true
        dropMinResponses:
          type: integer
          description: Minimum responses before the drop score check applies.
          format: uint32
          nullable: true
        dropScore:
          type: number
          description: Score floor - users below this score exit the distilling campaign.
          format: double
          nullable: true
        maxDistillingSessions:
          type: integer
          description: Maximum sessions before user exits the distilling campaign.
          format: uint32
          nullable: true
        inactivityDropDays:
          type: integer
          description: Number of days of inactivity before a distilling user is dropped.
          format: uint32
          nullable: true
        minSubmissionRate:
          type: number
          description: Minimum submission rate before a user is dropped.
          format: double
          nullable: true
        minSessionsForSubmissionRate:
          type: integer
          description: Minimum number of sessions before the submission rate check applies.
          format: uint32
          nullable: true
        minSubmissionRateGraduated:
          type: number
          description: Minimum submission rate for graduated users.
          format: double
          nullable: true
        distillingRetrievalMode:
          allOf:
          - $ref: '#/components/schemas/RetrievalMode'
          description: The retrieval mode used by the distilling campaign to select rapids for users.
        boostLevel:
          allOf:
          - $ref: '#/components/schemas/BoostLevel'
          description: The current boost level applied to the audience.
        randomAdmissionProbability:
          type: number
          description: The probability of admitting a random user to the audience.
          format: double
          nullable: true
        health:
          type: number
          description: The health score of the audience.
          format: double
          nullable: true
        graduated:
          type: integer
          description: The number of graduated users.
          format: int64
        dropped:
          type: integer
          description: The number of dropped users.
          format: int64
    IAudienceFilterDemographicAudienceFilter:
