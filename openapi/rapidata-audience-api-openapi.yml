            type: integer
            format: int32
    UpdateBoostConfigEndpoint_Output:
      type: object
      properties:
        recalculationId:
          type: string
          description: "The id of the audience state recalculation dispatched by this update.\n Boost-only updates do not trigger a recalculation, so this is typically null."
          nullable: true
    GetAudienceByIdEndpoint_Output:
      required:
      - id
      - name
      - status
      - qualifiedUserCount
      - filters
      - createdAt
      - ownerId
      - ownerMail
      - isPublic
      - isDistilling
      - distillingCampaignId
      - graduationScore
      - distillingRetrievalMode
      - boostLevel
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the audience.
        name:
          type: string
          description: The name of the audience.
        description:
          type: string
          description: The markdown-supported description of the audience.
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/AudienceStatus'
          description: The current status of the audience.
        qualifiedUserCount:
          type: integer
          description: The number of users that have qualified for this audience.
          format: int64
        filters:
          allOf:
          - type: array
            items:
