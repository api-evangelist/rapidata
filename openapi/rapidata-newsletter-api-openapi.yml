openapi: 3.0.4
info:
  title: Rapidata Asset Newsletter API
  description: The API for the Rapidata Asset service
  version: v1
servers:
- url: https://api.rapidata.ai/
tags:
- name: Newsletter
  x-displayName: Newsletter
paths:
  /newsletter/subscribe:
    post:
      tags:
      - Newsletter
      summary: Signs an email address up to the newsletter.
      requestBody:
        description: The email to subscribe and a recaptcha token.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscribeToNewsletterEndpoint_Input'
        required: true
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
      security:
      - OpenIdConnect:
        - openid
        - profile
        - email
        - offline_access
  /newsletter/unsubscribe:
    post:
      tags:
      - Newsletter
      summary: Removes an email address from the newsletter.
      requestBody:
        description: The email to unsubscribe and a recaptcha token.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnsubscribeFromNewsletterEndpoint_Input'
        required: true
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
      security:
      - OpenIdConnect:
        - openid
        - profile
        - email
        - offline_access
components:
  schemas:
    UnsubscribeFromNewsletterEndpoint_Input:
      required:
      - email
      - token
      type: object
      properties:
        email:
          type: string
          description: The email of the user to unsubscribe.
        token:
          type: string
          description: The recaptcha token used to verify the caller is not a bot.
    SubscribeToNewsletterEndpoint_Input:
      required:
      - email
      - token
      type: object
      properties:
        email:
          type: string
          description: The email of the user to subscribe.
        token:
          type: string
          description: The recaptcha token used to verify the caller is not a bot.
    ValidationProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
  securitySchemes:
    OpenIdConnect:
      type: openIdConnect
      description: OpenID Connect connection flow
      openIdConnectUrl: https://auth.rapidata.ai/.well-known/openid-configuration
