openapi: 3.2.0
info:
  title: Rapidata Survey API
  description: The API for the Rapidata Asset service
  version: v1
servers:
- url: https://api.rapidata.ai/
tags:
- name: Survey
  x-displayName: Survey
paths:
  /identity/survey:
    post:
      tags:
      - Survey
      summary: Submits a survey for the calling customer
      requestBody:
        description: The survey fields to submit.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendSurveyEndpoint_Input'
        required: true
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
      security:
      - OpenIdConnect:
        - openid
        - profile
        - email
        - offline_access
      operationId: postIdentitySurvey
      x-operation-id-source: derived
components:
  schemas:
    ValidationProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    SendSurveyEndpoint_Input:
      required:
      - fields
      type: object
      properties:
        fields:
          allOf:
          - type: object
            additionalProperties:
              type: string
          description: The fields of the survey.
  securitySchemes:
    OpenIdConnect:
      type: openIdConnect
      description: OpenID Connect connection flow
      openIdConnectUrl: https://auth.rapidata.ai/.well-known/openid-configuration
