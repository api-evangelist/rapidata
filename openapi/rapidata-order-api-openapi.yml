          type: integer
          description: The priority is used to prioritize over other orders.
          format: int32
          nullable: true
        stickyConfig:
          allOf:
          - $ref: '#/components/schemas/StickyConfig'
          description: Configuration for sticky campaign behavior. Takes precedence over StickyState if both are provided.
        userScoreDimensions:
          allOf:
          - type: array
            items:
              type: string
            nullable: true
          description: The user score dimensions are used to determine the score of the responses from the user.
        demographicKeys:
          allOf:
          - type: array
            items:
              type: string
            nullable: true
          description: The demographic keys are used to determine which demographics to store on the responses from the user.
        userFilters:
          allOf:
          - type: array
            items:
              $ref: '#/components/schemas/IUserFilterModel'
            nullable: true
          description: The user filters are used to restrict the order to only collect votes from a specific demographic.
        validationSetId:
          type: string
          description: "The validation set id can be changed to point to a specific validation set. if not provided a sane default will be\n used."
          nullable: true
        selections:
          allOf:
          - type: array
            items:
              $ref: '#/components/schemas/ISelection'
            nullable: true
          description: The selections are used to determine which tasks are shown to a user.
        retrievalMode:
          allOf:
          - $ref: '#/components/schemas/RetrievalMode'
          description: The retrieval mode defines how rapids are retrieved from the active labeling pool.
        maxIterations:
          type: integer
          description: The maximum number of times a user is allowed to see the same rapid.
          format: int32
          nullable: true
        precedingOrderId:
          type: string
          description: Optional ID of the order that must complete before this order starts processing.
          nullable: true
      description: This model is used to create a simple order
