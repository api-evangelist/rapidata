components:
  schemas:
    QueryMatrixByLeaderboardEndpoint_Output:
      required:
      - index
      - columns
      - data
      type: object
      properties:
        index:
          allOf:
          - type: array
            items:
              type: string
          description: The participant names of the matrix rows, ordered strongest first.
        columns:
          allOf:
          - type: array
            items:
              type: string
          description: The participant names of the matrix columns, ordered strongest first.
        data:
          allOf:
          - type: array
            items:
              type: array
              items:
                type: number
                format: double
          description: The win counts; Data[i][j] holds the wins of Index[i] over Columns[j].
    FeatureFlag:
      required:
      - key
      - value
      type: object
      properties:
        key:
          type: string
        value:
          type: string
    QueryLeaderboardRunsEndpoint_Output:
      required:
      - id
      - name
      - status
      - createdAt
      - ownerMail
