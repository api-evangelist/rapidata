    CreateLeaderboardEndpoint_Input:
      required:
      - name
      - instruction
      - showPrompt
      type: object
      properties:
        benchmarkId:
          type: string
          description: If the leaderboard should be added to a preexisting benchmark, the benchmark id.
          nullable: true
        benchmarkName:
          type: string
          description: When no BenchmarkId is provided, the name of the new benchmark to create.
          nullable: true
        benchmarkDescription:
          type: string
          description: "Optional plain-text credit for the people or sources behind the benchmark, applied to\n the new benchmark created via BenchmarkName. Limited to 2000 characters.\n Ignored when an existing BenchmarkId is provided. Leave unset for no\n description."
          nullable: true
        name:
          type: string
          description: The name of the leaderboard.
        instruction:
          type: string
          description: The instruction datapoints will be matched up against.
        showPrompt:
          type: boolean
          description: Indicates if the prompt is shown on the rapids.
        showPromptAsset:
          type: boolean
          description: Whether the prompt asset should be shown on the rapids.
        responseBudget:
          type: integer
          description: Total amount of responses that get collected per run.
          format: int32
          nullable: true
        minResponses:
          type: integer
          description: The minimum amount of responses that need to be collected per comparison.
          format: int32
          nullable: true
        isInversed:
          type: boolean
          description: Whether the results should be inversed, selecting the worse model.
        audienceId:
          type: string
          description: Optional audience id; defaults to the global audience when unset.
          nullable: true
        priority:
          type: integer
          description: "Optional priority override applied to every run's job. Admin-only.\n When unset, runs use the default leaderboard priority."
          format: int32
        weight:
          type: number
          description: "Multiplier applied to every match result of this leaderboard when it contributes to\n the parent benchmark's overall / combined scoreboards. Defaults to 1.0 when\n unset; unbounded (negative and zero values are accepted)."
          format: double
        scoreShift:
          type: number
          description: "Additive offset applied to displayed scores on this leaderboard's per-leaderboard\n scoreboard. Defaults to 0 when unset."
          format: double
        scoreScale:
          type: number
          description: "Multiplicative factor applied to displayed scores (relative to the Bradley-Terry\n center) on this leaderboard's per-leaderboard scoreboard. Defaults to 1.0 when\n unset; must be strictly positive."
          format: double
        isHidden:
          type: boolean
          description: Whether the leaderboard should be created hidden. Admin-only.
        isExcludedFromOverall:
          type: boolean
          description: "Whether the leaderboard is excluded from its benchmark's overall / combined scoreboard.\n When set, the leaderboard becomes an owner-only private experiment: its results do not\n contribute to the overall and it is visible only to its owner and admins. Defaults to\n false when unset."
        voteAggregation:
          allOf:
          - $ref: '#/components/schemas/VoteAggregation'
          description: "How individual votes on a matchup are aggregated into the stored result. AllVotes\n counts every vote as a matchup; MajorityVote collapses each matchup to a single\n win for the majority side (ties split 0.5/0.5). Defaults to AllVotes when unset."
        featureFlags:
          allOf:
          - type: array
            items:
              $ref: '#/components/schemas/FeatureFlag'
            nullable: true
          description: Feature flags applied to every order created by this leaderboard.
