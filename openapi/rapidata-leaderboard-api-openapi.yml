openapi: 3.0.4
info:
  title: Rapidata Asset Leaderboard API
  description: The API for the Rapidata Asset service
  version: v1
servers:
- url: https://api.rapidata.ai/
tags:
- name: Leaderboard
  x-displayName: Leaderboard
paths:
  /leaderboard/{leaderboardId}/boost:
    post:
      tags:
      - Leaderboard
      summary: Boosts a subset of participants within a leaderboard.
      parameters:
      - name: leaderboardId
        in: path
        description: The id of the leaderboard to boost.
        required: true
        schema:
          type: string
      requestBody:
        description: The payload describing the boost to apply.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoostLeaderboardEndpoint_Input'
        required: true
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
      security:
      - OpenIdConnect:
        - openid
        - profile
        - email
        - offline_access
  /leaderboard:
    post:
      tags:
      - Leaderboard
      summary: Creates a new leaderboard.
      requestBody:
        description: The current HTTP context, used for user claims.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLeaderboardEndpoint_Input'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateLeaderboardEndpoint_Output'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
      security:
      - OpenIdConnect:
        - openid
        - profile
        - email
        - offline_access
  /leaderboard/{leaderboardId}/participants:
    post:
      tags:
      - Leaderboard
      summary: Creates a participant in a leaderboard.
      parameters:
      - name: leaderboardId
        in: path
        description: The id of the leaderboard the participant will be added to.
        required: true
        schema:
          type: string
      requestBody:
        description: The payload describing the participant to create.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLeaderboardParticipantEndpoint_Input'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateLeaderboardParticipantEndpoint_Output'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
      security:
      - OpenIdConnect:
        - openid
        - profile
        - email
        - offline_access
    get:
      tags:
      - Leaderboard
      summary: Queries all participants connected to a leaderboard.
      parameters:
      - name: leaderboardId
        in: path
        description: The id of the leaderboard whose participants should be queried.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryParticipantsObsoleteEndpoint_Output'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
      security:
      - OpenIdConnect:
        - openid
        - profile
        - email
        - offline_access
  /leaderboard/{leaderboardId}/prompts:
    post:
      tags:
      - Leaderboard
      summary: Adds a new prompt to a leaderboard.
      parameters:
      - name: leaderboardId
        in: path
        description: The id of the leaderboard to add the prompt to.
        required: true
        schema:
          type: string
      requestBody:
        description: The prompt text.
        content:
          application/json:
            schema:
              type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePromptForLeaderboardEndpoint_Output'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
      security:
      - OpenIdConnect:
        - openid
        - profile
        - email
        - offline_access
  /leaderboard/{leaderboardId}:
    delete:
      tags:
      - Leaderboard
      summary: Deletes a leaderboard by its id.
      parameters:
      - name: leaderboardId
        in: path
        description: The id of the leaderboard to delete.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
      security:
      - OpenIdConnect:
        - openid
        - profile
        - email
        - offline_access
    get:
      tags:
      - Leaderboard
      summary: Gets a leaderboard by its id.
      parameters:
      - name: leaderboardId
        in: path
        description: The id of the leaderboard to retrieve.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetLeaderboardByIdEndpoint_Output'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
      security:
      - OpenIdConnect:
        - openid
        - profile
        - email
        - offline_access
    patch:
      tags:
      - Leaderboard
      summary: Updates a leaderboard using patch semantics.
      parameters:
      - name: leaderboardId
        in: path
        description: The id of the leaderboard to update.
        required: true
        schema:
          type: string
      requestBody:
        description: The patch payload describing which fields should change.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLeaderboardEndpoint_Input'
        required: true
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
      security:
      - OpenIdConnect:
        - openid
        - profile
        - email
        - offline_access
  /leaderboard/combined-matrix/query:
    get:
      tags:
      - Leaderboard
      summary: Queries the combined win matrix of multiple leaderboards.
      description: "Filters apply to the underlying votes. Benchmarks without granular vote storage evaluate\n only the filters their aggregated data can answer (tags, participants, leaderboards, runs,\n prompt identifiers); demographic and vote-time filters require granular vote storage."
      parameters:
      - name: leaderboardIds
        in: query
        description: The identifiers of the leaderboards to combine.
        required: true
        schema:
          type: array
          items:
            type: string
      - name: useWeightedScoring
        in: query
        description: Whether to apply weighted scoring based on user scores.
        schema:
          type: boolean
          default: false
      - name: country
        in: query
        description: Filter by country.
        style: deepObject
        explode: true
        schema:
          type: object
