openapi: 3.2.0
info:
  title: Rapidata Dataset API
  description: The API for the Rapidata Asset service
  version: v1
servers:
- url: https://api.rapidata.ai/
tags:
- name: Dataset
  x-displayName: Dataset
paths:
  /dataset:
    post:
      tags:
      - Dataset
      summary: Creates a new empty dataset
      requestBody:
        description: The dataset creation parameters.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDatasetEndpoint_Input'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDatasetEndpoint_Output'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
      security:
      - OpenIdConnect:
        - openid
        - profile
        - email
        - offline_access
      operationId: postDataset
      x-operation-id-source: derived
  /dataset/{datasetId}:
    get:
      tags:
      - Dataset
      summary: Gets a dataset by its id
      parameters:
      - name: datasetId
        in: path
        description: The id of the dataset to get.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDatasetByIdEndpoint_Output'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
      security:
      - OpenIdConnect:
        - openid
        - profile
        - email
        - offline_access
      operationId: getDatasetByDatasetId
      x-operation-id-source: derived
  /dataset/{datasetId}/progress:
    get:
      tags:
      - Dataset
      summary: Gets the upload progress of a dataset
      parameters:
      - name: datasetId
        in: path
        description: The id of the dataset to get the progress of.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDatasetProgressEndpoint_Output'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
      security:
      - OpenIdConnect:
        - openid
        - profile
        - email
        - offline_access
      operationId: getDatasetByDatasetIdProgress
      x-operation-id-source: derived
  /dataset/{datasetId}/name:
    patch:
      tags:
      - Dataset
      summary: Updates the name of a dataset
      parameters:
      - name: datasetId
        in: path
        description: The id of the dataset to update.
        required: true
        schema:
          type: string
      requestBody:
        description: The new name for the dataset.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDatasetNameEndpoint_Input'
        required: true
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
      security:
      - OpenIdConnect:
        - openid
        - profile
        - email
        - offline_access
      operationId: patchDatasetByDatasetIdName
      x-operation-id-source: derived
components:
  schemas:
    GetDatasetByIdEndpoint_Output:
      required:
      - name
      type: object
      properties:
        name:
          type: string
          description: The name of the dataset.
    CreateDatasetEndpoint_Input:
      required:
      - name
      type: object
      properties:
        name:
          type: string
          description: The name to give to the new dataset.
      description: The input for the create dataset endpoint.
    UpdateDatasetNameEndpoint_Input:
      required:
      - name
      type: object
      properties:
        name:
          type: string
          description: The new name of the dataset.
    ValidationProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    GetDatasetProgressEndpoint_Output:
      required:
      - total
      - ready
      - pending
      - failed
      type: object
      properties:
        total:
          type: integer
          description: The total number of datapoints in the dataset.
          format: int32
        ready:
          type: integer
          description: The number of datapoints that have been uploaded successfully.
          format: int32
        pending:
          type: integer
          description: The number of datapoints that are still being processed.
          format: int32
        failed:
          type: integer
          description: The number of datapoints that failed to upload.
          format: int32
    CreateDatasetEndpoint_Output:
      required:
      - datasetId
      type: object
      properties:
        datasetId:
          type: string
          description: The id of the created dataset.
      description: The result when a dataset has been created.
  securitySchemes:
    OpenIdConnect:
      type: openIdConnect
      description: OpenID Connect connection flow
      openIdConnectUrl: https://auth.rapidata.ai/.well-known/openid-configuration
