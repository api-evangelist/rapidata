openapi: 3.2.0
info:
  title: Rapidata Dataset Group API
  description: The API for the Rapidata Asset service
  version: v1
servers:
- url: https://api.rapidata.ai/
tags:
- name: DatasetGroup
  x-displayName: DatasetGroup
paths:
  /dataset/{datasetId}/group:
    post:
      tags:
      - DatasetGroup
      summary: Creates a new dataset group
      parameters:
      - name: datasetId
        in: path
        description: The id of the dataset to create the group for.
        required: true
        schema:
          type: string
      requestBody:
        description: The dataset group creation parameters.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDatasetGroupEndpoint_Input'
        required: true
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
      security:
      - OpenIdConnect:
        - openid
        - profile
        - email
        - offline_access
      operationId: postDatasetByDatasetIdGroup
      x-operation-id-source: derived
components:
  schemas:
    IAssetInputTextAssetInput:
      required:
      - text
      - _t
      properties:
        _t:
          enum:
          - TextAssetInput
          type: string
        text:
          type: string
        metadata:
          type:
          - object
          - 'null'
          oneOf:
          - $ref: '#/components/schemas/MetadataInputCollection'
        identifier:
          type:
          - string
          - 'null'
    CreateDatasetGroupEndpoint_Input:
      required:
      - group
      type: object
      properties:
        group:
          type: string
          description: The name of the group.
        context:
          type:
          - string
          - 'null'
          description: The optional text context for the group.
        contextAsset:
          allOf:
          - $ref: '#/components/schemas/IAssetInput'
          description: The optional asset context for the group.
    MetadataInputCollection:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/IMetadataInput'
    IAssetInputExistingAssetInput:
      required:
      - name
      - _t
      properties:
        _t:
          enum:
          - ExistingAssetInput
          type: string
        name:
          type: string
        metadata:
          type:
          - object
          - 'null'
          oneOf:
          - $ref: '#/components/schemas/MetadataInputCollection'
        identifier:
          type:
          - string
          - 'null'
    IMetadataInputTextMetadataInput:
      required:
      - text
      - visibilities
      - _t
      properties:
        _t:
          enum:
          - TextMetadataInput
          type: string
        text:
          type:
          - string
          - 'null'
        visibilities:
          $ref: '#/components/schemas/MetadataVisibilities'
    ValidationProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    IAssetInput:
      required:
      - _t
      type: object
      oneOf:
      - $ref: '#/components/schemas/IAssetInputExistingAssetInput'
      - $ref: '#/components/schemas/IAssetInputMultiAssetInput'
      - $ref: '#/components/schemas/IAssetInputTextAssetInput'
      discriminator:
        propertyName: _t
        mapping:
          ExistingAssetInput: '#/components/schemas/IAssetInputExistingAssetInput'
          MultiAssetInput: '#/components/schemas/IAssetInputMultiAssetInput'
          TextAssetInput: '#/components/schemas/IAssetInputTextAssetInput'
    MetadataVisibilities:
      type: array
      items:
        enum:
        - None
        - Users
        - Customers
        - Admins
        - Dashboard
        - All
        type: string
    IMetadataInput:
      required:
      - _t
      type: object
      oneOf:
      - $ref: '#/components/schemas/IMetadataInputTextMetadataInput'
      discriminator:
        propertyName: _t
        mapping:
          TextMetadataInput: '#/components/schemas/IMetadataInputTextMetadataInput'
    IAssetInputMultiAssetInput:
      required:
      - assets
      - _t
      properties:
        _t:
          enum:
          - MultiAssetInput
          type: string
        assets:
          type: array
          items:
            $ref: '#/components/schemas/IAssetInput'
        metadata:
          type:
          - object
          - 'null'
          oneOf:
          - $ref: '#/components/schemas/MetadataInputCollection'
        identifier:
          type:
          - string
          - 'null'
  securitySchemes:
    OpenIdConnect:
      type: openIdConnect
      description: OpenID Connect connection flow
      openIdConnectUrl: https://auth.rapidata.ai/.well-known/openid-configuration
