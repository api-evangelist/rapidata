openapi: 3.0.4
info:
  title: Rapidata Asset Benchmark API
  description: The API for the Rapidata Asset service
  version: v1
servers:
- url: https://api.rapidata.ai/
tags:
- name: Benchmark
  x-displayName: Benchmark
paths:
  /benchmark:
    post:
      tags:
      - Benchmark
      summary: Creates a benchmark.
      requestBody:
        description: The payload describing the benchmark to create.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBenchmarkEndpoint_Input'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBenchmarkEndpoint_Output'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
      security:
      - OpenIdConnect:
        - openid
        - profile
        - email
        - offline_access
  /benchmark/{benchmarkId}/participants:
    post:
      tags:
      - Benchmark
      summary: Creates a participant in a benchmark.
      parameters:
      - name: benchmarkId
        in: path
        description: The id of the benchmark the participant will be added to.
        required: true
        schema:
          type: string
      requestBody:
        description: The payload describing the participant to create.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBenchmarkParticipantEndpoint_Input'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
