  /benchmark/combined-matrix/query:
    get:
      tags:
      - Benchmark
      summary: Queries the combined win matrix of multiple benchmarks.
      description: "Filters apply to the underlying votes. Benchmarks without granular vote storage evaluate\n only the filters their aggregated data can answer (tags, participants, leaderboards, runs,\n prompt identifiers); demographic and vote-time filters require granular vote storage."
      parameters:
      - name: benchmarkIds
        in: query
        description: The identifiers of the benchmarks to combine.
        required: true
        schema:
          type: array
          items:
            type: string
      - name: useWeightedScoring
        in: query
        description: Whether to apply weighted scoring based on user scores.
        schema:
          type: boolean
          default: false
      - name: country
        in: query
        description: Filter by country.
        style: deepObject
        explode: true
        schema:
          type: object
