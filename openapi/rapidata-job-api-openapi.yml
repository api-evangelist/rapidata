components:
  schemas:
    IOrderWorkflowInputModelGroupedRankingWorkflowInputModel:
      required:
      - criteria
      - _t
      properties:
        _t:
          enum:
          - GroupedRankingWorkflow
          type: string
        criteria:
          type: string
        pairMakerConfig:
          $ref: '#/components/schemas/IPairMakerConfigModel'
        rankingConfig:
          type: object
          oneOf:
          - $ref: '#/components/schemas/IRankingConfigModel'
          nullable: true
        contexts:
          type: object
          additionalProperties:
            type: string
          nullable: true
        contextAssets:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/IAssetInput'
          nullable: true
        featureFlags:
          type: array
          items:
            $ref: '#/components/schemas/FeatureFlag'
        maxParallelism:
          type: integer
          format: int32
    CreateJobRevisionEndpoint_Input:
      type: object
      properties:
        workflow:
          allOf:
          - $ref: '#/components/schemas/IOrderWorkflowInputModel'
          description: "The workflow configuration. If not provided, inherits from the previous revision.\n Must be provided together with Referee if either is specified."
        referee:
          allOf:
          - $ref: '#/components/schemas/IRefereeModel'
          description: "The referee configuration. If not provided, inherits from the previous revision.\n Must be provided together with Workflow if either is specified."
        datasetId:
          type: string
          description: The dataset id. If not provided, inherits from the previous revision.
        rapidFeatureFlags:
          allOf:
          - type: array
            items:
              $ref: '#/components/schemas/FeatureFlag'
          description: "The rapid-level feature flags applied to each rapid created by this revision.\n If not provided, inherits from the previous revision."
        campaignFeatureFlags:
          allOf:
          - type: array
            items:
              $ref: '#/components/schemas/FeatureFlag'
          description: "The campaign-level (session-wide) feature flags for this revision.\n If not provided, inherits from the previous revision."
        aggregatorType:
          type: string
          oneOf:
          - $ref: '#/components/schemas/AggregatorType'
          description: The aggregator type. If not provided, inherits from the previous revision.
          nullable: true
        validationSetId:
          type: string
          description: "A validation set id to pin on this revision. When set, every job run from this\n revision uses the specified validation set as the source of validation rapids\n instead of audience-derived examples. If not provided, inherits from the previous\n revision. Provide a wrapped null value to clear a previously pinned set."
          nullable: true
      description: The input for the create job revision endpoint.
    FeatureFlag:
      required:
      - key
      - value
      type: object
      properties:
        key:
          type: string
        value:
          type: string
    IRapidBlueprint:
      required:
      - _t
      type: object
      oneOf:
      - $ref: '#/components/schemas/IRapidBlueprintAttachCategoryRapidBlueprint'
      - $ref: '#/components/schemas/IRapidBlueprintBoundingBoxRapidBlueprint'
      - $ref: '#/components/schemas/IRapidBlueprintCompareRapidBlueprint'
      - $ref: '#/components/schemas/IRapidBlueprintFreeTextRapidBlueprint'
      - $ref: '#/components/schemas/IRapidBlueprintLineRapidBlueprint'
      - $ref: '#/components/schemas/IRapidBlueprintLocateRapidBlueprint'
      - $ref: '#/components/schemas/IRapidBlueprintNamedEntityRapidBlueprint'
      - $ref: '#/components/schemas/IRapidBlueprintPolygonRapidBlueprint'
      - $ref: '#/components/schemas/IRapidBlueprintScrubRapidBlueprint'
      - $ref: '#/components/schemas/IRapidBlueprintTranscriptionRapidBlueprint'
      discriminator:
        propertyName: _t
        mapping:
          ClassifyBlueprint: '#/components/schemas/IRapidBlueprintAttachCategoryRapidBlueprint'
          BoundingBoxBlueprint: '#/components/schemas/IRapidBlueprintBoundingBoxRapidBlueprint'
          CompareBlueprint: '#/components/schemas/IRapidBlueprintCompareRapidBlueprint'
          FreeTextBlueprint: '#/components/schemas/IRapidBlueprintFreeTextRapidBlueprint'
          LineBlueprint: '#/components/schemas/IRapidBlueprintLineRapidBlueprint'
          LocateBlueprint: '#/components/schemas/IRapidBlueprintLocateRapidBlueprint'
          NamedEntityBlueprint: '#/components/schemas/IRapidBlueprintNamedEntityRapidBlueprint'
          PolygonBlueprint: '#/components/schemas/IRapidBlueprintPolygonRapidBlueprint'
          ScrubBlueprint: '#/components/schemas/IRapidBlueprintScrubRapidBlueprint'
          TranscriptionBlueprint: '#/components/schemas/IRapidBlueprintTranscriptionRapidBlueprint'
