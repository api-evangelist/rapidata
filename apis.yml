aid: rapidata
name: Rapidata
description: >-
  Rapidata provides human feedback at scale — crowd-sourced labeling, model
  evaluation, ranking, and preference data (RLHF-style) collected from real
  people worldwide. Teams use the Rapidata API and Python SDK to run online
  RLHF, refine model behavior, and evaluate model outputs (image, video, audio,
  and text) with pairwise A/B comparisons, ranking, and leaderboards, as well as
  to collect targeted human annotations (classification, locating, bounding,
  transcription, free text, select-words) by country, language, or demographic,
  with built-in quality control and confidence-based early stopping. The REST
  API is OAuth 2.0 / OpenID Connect secured and reaches thousands of
  high-quality annotations per minute. Rapidata AG is a portfolio company of
  Canaan Partners.
url: https://raw.githubusercontent.com/api-evangelist/rapidata/refs/heads/main/apis.yml
